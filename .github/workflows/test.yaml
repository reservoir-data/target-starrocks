name: Test target-starrocks

on:
  push:
    branches: [main]
    paths:
    - .github/workflows/test.yml
    - target_starrocks/**
    - tests/**
    - compose.yml
    - pyproject.toml
    - uv.lock
  pull_request:
    paths:
    - .github/workflows/test.yml
    - target_starrocks/**
    - tests/**
    - compose.yml
    - pyproject.toml
    - uv.lock
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1
  # renovate: datasource=pypi depName=tox
  TOX_VERSION: 4.46.3
  # renovate: datasource=pypi depName=tox-gh
  TOX_GH_VERSION: 1.7.1
  # renovate: datasource=pypi depName=tox-uv
  TOX_UV_VERSION: 1.33.0
  # renovate: datasource=pypi depName=uv
  UV_VERSION: 0.10.7

jobs:
  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest
    outputs:
      supported-python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@efb823f52190ad02594531168b7a2d5790e66516 # v2.14.0
        id: baipp

  pytest:
    name: Test
    runs-on: ubuntu-latest
    needs: build-package
    env:
      STARROCKS_DATABASE: pytest
      STARROCKS_PORT: 9030

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.build-package.outputs.supported-python-versions) }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - run: |
        docker compose up --quiet-pull --wait
        docker compose exec starrocks mysql -P ${{ env.STARROCKS_PORT }} -h 127.0.0.1 -u root -e 'create database if not exists ${{ env.STARROCKS_DATABASE }}'
        docker compose ps
    - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1
      with:
        python-version: ${{ matrix.python-version }}
        version: ${{ env.UV_VERSION }}
    - name: Run Tox
      env:
        TARGET_STARROCKS_USER: root
        TARGET_STARROCKS_HOST: localhost
        TARGET_STARROCKS_PORT: ${{ env.STARROCKS_PORT }}
        TARGET_STARROCKS_DATABASE: ${{ env.STARROCKS_DATABASE }}
      run: >
        uvx
        --with tox-gh==${{ env.TOX_GH_VERSION }}
        --with tox-uv==${{ env.TOX_UV_VERSION }}
        --with tox==${{ env.TOX_VERSION }}
        tox
