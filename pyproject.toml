[project]
name = "target-starrocks"
dynamic = ["version"]
description = "Singer target for StarRocks, built with the Meltano Singer SDK."
authors = [{ name = "Edgar Ramírez-Mondragón", email = "edgarrm358@gmail.com" }]
requires-python = ">=3.13"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "Meltano",
    "ELT",
    "StarRocks",
    "singer-tap",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "singer-sdk[faker]~=0.53.2",
    "starrocks~=1.2.0",
]

[project.optional-dependencies]
s3 = [
    "s3fs~=2026.2.0",
]

[project.scripts]
target-starrocks = "target_starrocks.target:TargetStarRocks.cli"

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "typing" },
]
test = [
    "pytest>=9",
    "singer-sdk[testing]",
]
typing = [
    { include-group = "test" },
    "mypy>=1.19.1",
    "ty>=0.0.17",
]

[tool.hatch.version]
source = "vcs"

[tool.pytest]
addopts = [
    "--durations=10",
]
minversion = "9"
xfail_strict = true

[tool.mypy]
follow_untyped_imports = true
strict = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.ruff.lint]
ignore = [
    "COM812",  # missing-trailing-comma
    "ISC001",  # single-line-implicit-string-concatenation
]
select = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = [
    "hatchling==1.29.0",
    "hatch-vcs==0.5",
]
build-backend = "hatchling.build"

[tool.tox]
min_version = "4.22"
requires = [
    "tox>=4.22",
    "tox-gh>=1.6.1",
    "tox-uv",
]
env_list = [
  "typing",
  "3.14",
  "3.13",
]

[tool.tox.gh.python]
"3.14" = [ "3.14", "typing" ]
"3.13" = [ "3.13" ]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
pass_env = [ "TARGET_STARROCKS_*" ]
dependency_groups = [ "test" ]
commands = [ [ "pytest", { replace = "posargs", default = [ "tests" ], extend = true } ] ]

[tool.tox.env.typing]
dependency_groups = [ "typing" ]
commands = [
    [ "mypy", "target_starrocks", "tests" ],
    [ "ty", "check", "target_starrocks", "tests" ],
]
