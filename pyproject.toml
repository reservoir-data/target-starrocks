[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs==0.5",
  "hatchling==1.29",
]

[project]
name = "target-starrocks"
description = "Singer target for StarRocks, built with the Meltano Singer SDK."
readme = "README.md"
keywords = [
  "ELT",
  "Meltano",
  "singer-tap",
  "StarRocks",
]
license = "Apache-2.0"
requires-python = ">=3.13"
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "singer-sdk[faker]~=0.54.0a5",
  "sqlalchemy==2.0.49",
  "starrocks~=1.3.3",
]
[[project.authors]]
name = "Edgar Ramírez-Mondragón"
email = "edgarrm358@gmail.com"
[project.optional-dependencies]
s3 = [
  "s3fs>=2026.2",
]
[project.scripts]
target-starrocks = "target_starrocks.target:TargetStarRocks.cli"

[dependency-groups]
dev = [
  { include-group = "testing" },
  { include-group = "typing" },
]
testing = [
  "deptry>=0.24",
  "pytest>=9",
  "singer-sdk[testing]",
]
typing = [
  "mypy>=1.19.1",
  "ty>=0.0.17",
  { include-group = "testing" },
]

[tool.hatch.version]
fallback-version = "0.1.0.dev0"
source = "vcs"

[tool.uv.sources]
singer-sdk = { git = "https://github.com/meltano/sdk.git", rev = "main" }

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "COM812", # missing-trailing-comma
  "ISC001", # single-line-implicit-string-concatenation
]
flake8-annotations.allow-star-arg-any = true
pydocstyle.convention = "google"

[tool.deptry.package_module_name_map]
mypy = "mypy"
s3fs = "s3fs"
ty = "ty"
[tool.deptry.per_rule_ignores]
DEP002 = [ "s3fs" ]

[tool.pyproject-fmt]
table_format = "long"

[tool.mypy]
enable_error_code = [
  "exhaustive-match",
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]
follow_untyped_imports = true
strict = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.ty.rules]
unused-type-ignore-comment = "ignore"

[tool.pytest]
addopts = [
  "--durations=10",
  "-ra",
]
filterwarnings = [ "error" ]
log_level = "INFO"
minversion = "9"
strict = true
testpaths = [ "tests" ]

[tool.tox]
requires = [
  "tox>=4.53",
  "tox-gh>=1.7.1",
  "tox-uv>=1.35",
]
env_list = [
  "dependencies",
  "typing",
  { prefix = "3.", start = 13 },
]
[tool.tox.env.dependencies]
description = "check for unused, missing and transitive dependencies"
labels = [ "check" ]
dependency_groups = [ "testing" ]
commands = [ [ "deptry", "." ] ]
[tool.tox.env.typing]
description = "type checks"
labels = [ "check" ]
dependency_groups = [ "typing" ]
commands = [
  [ "mypy", "target_starrocks", "tests" ],
  [ "ty", "check", "target_starrocks", "tests" ],
]

[tool.tox.env_run_base]
description = "run tests on Python {py_dot_ver}"
runner = "uv-venv-lock-runner"
pass_env = [ "TARGET_STARROCKS_*" ]
dependency_groups = [ "testing" ]
commands = [ [ "pytest", { replace = "posargs", default = [ "tests" ], extend = true } ] ]
[tool.tox.gh.python]
"3.14" = [ "3.14", "typing" ]
"3.13" = [ "3.13" ]
