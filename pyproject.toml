[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs==0.5",
  "hatchling==1.32",
]

[project]
name = "target-starrocks"
description = "Singer target for StarRocks, built with the Meltano Singer SDK."
readme = "README.md"
keywords = [
  "ELT",
  "Meltano",
  "singer-tap",
  "StarRocks",
]
license = "Apache-2.0"
requires-python = ">=3.13"
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [
  "singer-sdk[faker]~=0.54.5",
  "sqlalchemy==2.0.52",
  "starrocks~=1.3.3",
]
[[project.authors]]
name = "Edgar Ramírez-Mondragón"
email = "edgarrm358@gmail.com"
[project.optional-dependencies]
s3 = [
  "s3fs>=2026.2",
]
[project.scripts]
target-starrocks = "target_starrocks.target:TargetStarRocks.cli"

[dependency-groups]
dev = [
  "deptry>=0.25",
  { include-group = "testing" },
  { include-group = "typing" },
]
testing = [
  "pytest>=9",
  "singer-sdk[testing]",
]
typing = [
  "mypy>=2.1",
  "ty>=0.0.50",
  { include-group = "testing" },
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0.dev0"

[tool.uv]
override-dependencies = [
  "singer-sdk[faker]>=0.55.0a9",
]

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "COM812", # missing-trailing-comma
  "ISC001", # single-line-implicit-string-concatenation
]
flake8-annotations.allow-star-arg-any = true
pydocstyle.convention = "google"

[tool.deptry.per_rule_ignores]
DEP002 = [ "s3fs" ]

[tool.pyproject-fmt]
table_format = "long"

[tool.mypy]
follow_untyped_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = [
  "exhaustive-match",
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]
strict = true
warn_unused_configs = true

[tool.ty.rules]
unused-type-ignore-comment = "ignore"

[tool.pytest]
addopts = [
  "--durations=10",
  "-ra",
]
filterwarnings = [ "error" ]
log_level = "INFO"
minversion = "9"
strict = true
testpaths = [ "tests" ]

[tool.tox]
requires = [
  "tox>=4.55",
  "tox-uv>=1.35",
]
env_list = [
  "dependencies",
  "typing",
  { prefix = "3.", start = 13 },
]
[tool.tox.env.dependencies]
description = "check for unused, missing and transitive dependencies"
dependency_groups = [ "dev" ]
extras = [ "s3" ]
commands = [ [ "deptry", "." ] ]
labels = [ "check" ]
[tool.tox.env.typing]
description = "type checks"
dependency_groups = [ "typing" ]
commands = [
  [ "mypy", "target_starrocks", "tests" ],
  [ "ty", "check", "target_starrocks", "tests" ],
]
labels = [ "check" ]
[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
description = "run tests on Python {py_dot_ver}"
base_python_file = [ ".python-version" ]
dependency_groups = [ "testing" ]
pass_env = [ "TARGET_STARROCKS_*" ]
commands = [ [ "pytest", { replace = "posargs", default = [ "tests" ], extend = true } ] ]
